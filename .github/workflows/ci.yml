name: BLD8 UI validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bld8-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ github.event_name == 'pull_request' && 'UI PR checks' || 'UI Release checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Check workspace types
        run: npm run typecheck
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run interaction and accessibility checks
        run: npm test -- --workers=2
      - name: Save failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
